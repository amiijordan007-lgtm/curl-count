<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curl Counter</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--text:#1c1c1a;--mute:#76766f;--acc:#e8590c;--line:#e4e4de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1f1d;--text:#f2f2ee;--mute:#9a9a92;--acc:#ff8a4c;--line:#333330;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:20px 16px 32px}
h1{font-size:18px;margin:0 0 16px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.badge{position:absolute;right:10px;top:8px;z-index:2;font-size:44px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.ang{position:absolute;left:10px;top:12px;z-index:2;font-size:16px;font-weight:600;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.count{font-size:96px;font-weight:700;line-height:1;text-align:center;color:var(--acc);font-variant-numeric:tabular-nums;margin-top:12px}
.label{text-align:center;color:var(--mute);font-size:14px}
.row{display:flex;gap:10px;margin-top:14px}
button{flex:1;font:inherit;font-weight:600;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text)}
button.primary,button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button:active{transform:scale(.97)}
.status{text-align:center;font-size:13px;color:var(--mute);margin-top:12px;min-height:18px}
label{font-size:14px;color:var(--mute);display:flex;justify-content:space-between}
input[type=range]{width:100%;margin-top:10px;accent-color:var(--acc)}
.sets{list-style:none;margin:10px 0 0;padding:0}
.sets li{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hint{font-size:13px;color:var(--mute);line-height:1.5;margin:10px 0 0}
</style>
</head>
<body>
<main>
<h1>Curl Counter</h1>
<div class="card">
  <div class="cam">
    <video id="vid" playsinline muted></video>
    <canvas id="ov"></canvas>
    <div class="ang" id="ang"></div>
    <div class="badge" id="badge"></div>
  </div>
  <div class="count" id="count">0</div>
  <div class="label">reps this set</div>
  <div class="row">
    <button id="armA" class="on">Auto arm</button>
    <button id="armL">Left</button>
    <button id="armR">Right</button>
  </div>
  <div class="row"><button id="minus">−1</button><button id="plus">+1</button></div>
  <div class="row"><button class="primary" id="go">Start camera</button></div>
  <div class="status" id="status">Prop your phone up so your shoulder, elbow and wrist are all in view.</div>
</div>
<div class="card">
  <label><span>Curl depth needed</span><span id="sensVal">5</span></label>
  <input type="range" id="sens" min="1" max="10" value="5">
  <p class="hint">It tracks the angle at your elbow, so head and body movement are ignored. Raise the slider if reps are missed (counts shallower curls). Lower it to demand a fuller curl.</p>
</div>
<div class="card">
  <div class="row" style="margin-top:0"><button id="save">Finish set</button><button id="reset">Reset</button></div>
  <ul class="sets" id="sets"></ul>
</div>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var VER='0.10.14';
  var BASE='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@'+VER;
  var MODEL='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
  var count=0,sets=[],stream=null,running=false,counting=false,raf=0,lm=null,arm='auto';
  var phase='down',ang=null,lastRep=0,lastVT=-1;
  var ov=$('ov'),ctx=ov.getContext('2d');

  try{var s=localStorage.getItem('curl-sets');if(s)sets=JSON.parse(s)||[]}catch(e){}
  try{var v=localStorage.getItem('curl-sens');if(v)$('sens').value=v}catch(e){}
  $('sensVal').textContent=$('sens').value;

  function render(){
    $('count').textContent=count;$('badge').textContent=counting?count:'';
    var ul=$('sets');ul.innerHTML='';
    sets.slice(-6).reverse().forEach(function(x,i){
      var li=document.createElement('li');
      li.innerHTML='<span>Set '+(sets.length-i)+'</span><b>'+x+' reps</b>';ul.appendChild(li);
    });
  }
  function bump(n){count=Math.max(0,count+n);render();if(n>0&&navigator.vibrate){try{navigator.vibrate(25)}catch(e){}}}

  function angleAt(a,b,c,asp){ // angle at b, in degrees
    var v1x=(a.x-b.x)*asp,v1y=a.y-b.y,v2x=(c.x-b.x)*asp,v2y=c.y-b.y;
    var dot=v1x*v2x+v1y*v2y,m=Math.hypot(v1x,v1y)*Math.hypot(v2x,v2y);
    if(!m)return null;
    return Math.acos(Math.max(-1,Math.min(1,dot/m)))*180/Math.PI;
  }
  function vis(p){return p.visibility==null?1:p.visibility}

  function pickArm(p){
    var L=[p[11],p[13],p[15]],R=[p[12],p[14],p[16]];
    if(arm==='left')return L;
    if(arm==='right')return R;
    var sl=vis(L[0])+vis(L[1])+vis(L[2]),sr=vis(R[0])+vis(R[1])+vis(R[2]);
    return sl>=sr?L:R;
  }

  function loop(){
    raf=requestAnimationFrame(loop);
    var vid=$('vid');
    if(!lm||!vid.videoWidth||vid.currentTime===lastVT)return;
    lastVT=vid.currentTime;
    var res;
    try{res=lm.detectForVideo(vid,performance.now())}catch(e){return}
    ctx.clearRect(0,0,ov.width,ov.height);
    var p=res&&res.landmarks&&res.landmarks[0];
    if(!p){$('ang').textContent='No person found';return}
    var a=pickArm(p);
    var ok=vis(a[0])>0.5&&vis(a[1])>0.5&&vis(a[2])>0.5;
    // draw only the tracked arm
    ctx.strokeStyle=ok?'#ff8a4c':'#aaa';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(a[0].x*ov.width,a[0].y*ov.height);
    ctx.lineTo(a[1].x*ov.width,a[1].y*ov.height);
    ctx.lineTo(a[2].x*ov.width,a[2].y*ov.height);ctx.stroke();
    a.forEach(function(q){ctx.beginPath();ctx.arc(q.x*ov.width,q.y*ov.height,9,0,7);ctx.fill()});
    if(!ok){$('ang').textContent='Arm not fully visible';return}
    var raw=angleAt(a[0],a[1],a[2],vid.videoWidth/vid.videoHeight);
    if(raw==null)return;
    ang=ang==null?raw:ang*0.5+raw*0.5;
    $('ang').textContent='Elbow '+Math.round(ang)+'°';
    if(!counting)return;
    var sens=+$('sens').value,curled=40+sens*5,extended=140,now=Date.now();
    if(phase==='down'&&ang<curled){phase='up'}
    else if(phase==='up'&&ang>extended&&now-lastRep>400){phase='down';lastRep=now;bump(1)}
  }

  async function load(){
    if(lm)return true;
    $('status').textContent='Loading pose model…';
    try{
      var mod=await import(BASE+'/+esm');
      var fs=await mod.FilesetResolver.forVisionTasks(BASE+'/wasm');
      var mk=function(d){return mod.PoseLandmarker.createFromOptions(fs,{
        baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:'VIDEO',numPoses:1})};
      try{lm=await mk('GPU')}catch(e){lm=await mk('CPU')}
      return true;
    }catch(e){
      $('status').textContent='Couldn’t load the pose model. This needs internet and a normal web host (not Claude’s preview).';
      return false;
    }
  }

  async function start(){
    var st=$('status');
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){st.textContent='Camera isn’t available here.';return}
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:960}},audio:false});
    }catch(e){st.textContent='Camera access was blocked. Allow it in your browser settings.';return}
    if(!(await load())){stream.getTracks().forEach(function(t){t.stop()});stream=null;return}
    var vid=$('vid');vid.srcObject=stream;await vid.play().catch(function(){});
    ov.width=vid.videoWidth||720;ov.height=vid.videoHeight||960;
    running=true;$('go').textContent='Stop';phase='down';ang=null;lastVT=-1;
    var c=3;st.textContent='Get in position… '+c;
    var iv=setInterval(function(){
      c--;if(!running){clearInterval(iv);return}
      if(c>0)st.textContent='Get in position… '+c;
      else{clearInterval(iv);counting=true;st.textContent='Counting. Start curling!';render()}
    },1000);
    cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
  }
  function stop(){
    running=false;counting=false;cancelAnimationFrame(raf);
    if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
    $('vid').srcObject=null;ctx.clearRect(0,0,ov.width,ov.height);
    $('ang').textContent='';$('go').textContent='Start camera';$('status').textContent='Stopped.';render();
  }

  function setArm(a){
    arm=a;phase='down';
    ['A','L','R'].forEach(function(k){$('arm'+k).className=''});
    $('arm'+(a==='auto'?'A':a==='left'?'L':'R')).className='on';
  }
  $('armA').onclick=function(){setArm('auto')};
  $('armL').onclick=function(){setArm('left')};
  $('armR').onclick=function(){setArm('right')};
  $('plus').onclick=function(){bump(1)};
  $('minus').onclick=function(){bump(-1)};
  $('go').onclick=function(){running?stop():start()};
  $('sens').oninput=function(){$('sensVal').textContent=this.value;try{localStorage.setItem('curl-sens',this.value)}catch(e){}};
  $('save').onclick=function(){if(count>0){sets.push(count);try{localStorage.setItem('curl-sets',JSON.stringify(sets.slice(-30)))}catch(e){}}count=0;phase='down';render()};
  $('reset').onclick=function(){count=0;render()};
  render();
})();
</script>
</body>
</html>
